<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restitution du débat</title>
<style>
/* Polices de l'appli Ecclesia (paquets @fontsource-variable, licence OFL), servies à côté de la page :
   Newsreader pour les titres et les énoncés, Archivo pour le texte. Aucun CDN. */
@font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 200 800; font-display: swap; src: url('newsreader-latin-opsz-normal.woff2') format('woff2'); }
@font-face { font-family: 'Newsreader'; font-style: italic; font-weight: 200 800; font-display: swap; src: url('newsreader-latin-opsz-italic.woff2') format('woff2'); }
@font-face { font-family: 'Archivo'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('archivo-latin-wght-normal.woff2') format('woff2'); }
@font-face { font-family: 'Archivo'; font-style: italic; font-weight: 100 900; font-display: swap; src: url('archivo-latin-wght-italic.woff2') format('woff2'); }

/* Charte de l'appli (chantier 168) : bleu marine, anthracite, bleu clair, crème, sable ;
   angles quasi droits, ombres douces teintées de marine. */
:root {
  color-scheme: light;
  --marine: #15233F; --marine2: #2B4A86; --anthracite: #20242B; --bleu-clair: #9BBBE2;
  --creme: #FBF9F4; --sable: #F1EBDD; --blanc: #FFFFFF;
  --line: #E2DFD9; --fg2: #55575A; --fg3: #898A8C;
  --pour: #1D7F45; --contre: #C0392B; --nuance: #6D6F71;
  --pour-vif: #2BB061; --contre-vif: #E5503B;
  --ta: #2B4A86; --tb: #B97A2A; --tc3: #1E6B6D; --tc4: #7A5C99;
  --serif: 'Newsreader', Georgia, serif;
  --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 2px;
  --shadow: 0 1px 3px 0 rgba(21,35,63,.08), 0 1px 2px -1px rgba(21,35,63,.06);
  --shadow-lg: 0 18px 36px -22px rgba(21,35,63,.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--sans); background: var(--creme); color: var(--anthracite); -webkit-font-smoothing: antialiased; line-height: 1.5; }
h1, h2, h3, h4 { font-family: var(--serif); letter-spacing: -0.01em; font-weight: 600; }
::selection { background: rgba(155,187,226,.45); }
:focus-visible { outline: 2px solid var(--bleu-clair); outline-offset: 2px; }
button, summary, label, input[type=checkbox], input[type=range] { cursor: pointer; }
input { accent-color: var(--marine); }
.hidden { display: none !important; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

/* ── En-tête ── */
.top { background: var(--marine); color: var(--creme); }
.brand { display: flex; align-items: center; gap: 14px; padding: 18px 0 14px; border-bottom: 1px solid rgba(251,249,244,.18); }
.brand img { width: 46px; height: 46px; }
.brand b { display: block; font-weight: 700; letter-spacing: .28em; font-size: .95rem; }
.brand small { display: block; font-weight: 600; letter-spacing: .22em; font-size: .64rem; opacity: .7; }
.hero { padding: 26px 0 22px; }
.surtitre { display: flex; align-items: center; gap: 12px; font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--bleu-clair); }
.accent-rect { display: inline-block; width: 2.75rem; height: 3px; background: var(--bleu-clair); }
.hero h1 { font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 500; line-height: 1.1; margin: 12px 0 8px; }
.texte-spectre { background-image: linear-gradient(105deg, #9BBBE2 0%, #D5E0ED 52%, #FBF9F4 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { font-size: .9rem; color: rgba(251,249,244,.78); max-width: 720px; }
.nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.nav a, .nav button { font: inherit; font-size: .78rem; font-weight: 600; color: var(--creme); text-decoration: none; border: 1px solid rgba(251,249,244,.38); background: rgba(251,249,244,.08); padding: 6px 12px; border-radius: var(--r); transition: background-color .2s, border-color .2s; }
.nav a:hover, .nav button:hover { background: rgba(251,249,244,.16); border-color: rgba(251,249,244,.6); }
.nav .sep { flex: 1; }
.nav i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* ── Accordéons ── */
main { padding: 28px 0 10px; }
details.acc { background: var(--blanc); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); margin-bottom: 16px; scroll-margin-top: 12px; }
details.acc > summary { list-style: none; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 18px 22px; border-left: 4px solid var(--acc, var(--marine)); }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary:hover { background: var(--creme); }
.acc-num { font-family: var(--serif); font-size: 1.9rem; font-weight: 500; color: var(--acc, var(--marine)); line-height: 1; min-width: 2.2ch; }
.acc-title h2 { font-size: 1.35rem; line-height: 1.2; color: var(--marine); }
.acc-title p { font-size: .8rem; color: var(--fg2); margin-top: 2px; }
.acc-chev { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; color: var(--marine); transition: transform .25s; }
.acc-chev::before { content: ''; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); }
details.acc[open] > summary .acc-chev { transform: rotate(180deg); }
details.acc[open] > summary { border-bottom: 1px solid var(--line); }
.acc-body { padding: 8px 22px 26px; }

/* Blocs internes */
.block { margin-top: 26px; }
.label { display: flex; align-items: center; gap: 10px; font-size: .7rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--marine); margin-bottom: 12px; }
.label::before { content: ''; width: 2.75rem; height: 3px; background: var(--marine); flex-shrink: 0; }
.help { font-size: .8rem; color: var(--fg2); margin: -4px 0 12px; max-width: 780px; }
.resume { font-family: var(--serif); font-size: 1.12rem; line-height: 1.65; background: var(--creme); border-left: 3px solid var(--bleu-clair); padding: 16px 20px; border-radius: 0 var(--r) var(--r) 0; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 14px; }
.stat { font-size: .78rem; color: var(--fg2); }
.stat b { font-family: var(--serif); font-size: 1.6rem; font-weight: 500; color: var(--marine); margin-right: 6px; }

/* Énoncés : consensus / dissensus */
.stmts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.stcol h3 { font-family: var(--sans); font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 2px solid var(--col); color: var(--col); margin-bottom: 4px; }
.st { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.st-rank { font-family: var(--serif); font-size: 1.5rem; color: var(--col); line-height: 1; }
.st-text { font-family: var(--serif); font-style: italic; font-size: 1.04rem; line-height: 1.4; }
.badge { display: inline-block; font-size: .64rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: var(--r); color: #fff; margin: 6px 6px 0 0; vertical-align: middle; }
.badge.pour { background: var(--pour); } .badge.contre { background: var(--contre); } .badge.diss { background: var(--marine2); }
.st-count { font-size: .74rem; color: var(--fg2); vertical-align: middle; }
.st-count b.p { color: var(--pour); } .st-count b.c { color: var(--contre); }
.voices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.voices > div { min-width: 0; }
.voices h5 { font-size: .6rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; }
.voices .vc h5 { color: var(--contre); } .voices .vn h5 { color: var(--nuance); } .voices .vp h5 { color: var(--pour); }
.dots { display: flex; flex-wrap: wrap; gap: 3px; min-height: 24px; }
.dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: .6rem; font-weight: 700; background: var(--dc); }
.dot.nu { background: var(--blanc); color: var(--anthracite); border: 2px dashed var(--dc); }
.dots .none { font-size: .74rem; color: var(--fg3); }
.ties, .short { font-size: .74rem; color: var(--fg2); margin-top: 8px; font-style: italic; }
details.howto { margin-top: 12px; font-size: .76rem; color: var(--fg2); }
details.howto summary { color: var(--marine2); font-weight: 600; }
details.howto p { margin-top: 6px; max-width: 820px; }

/* Cartes */
.map-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
.map-box svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .76rem; color: var(--fg2); margin-top: 8px; align-items: center; }
.legend span, .legend label { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.legend .sw { width: 20px; height: 0; border-top: 3px solid; border-radius: 0; }
.legend .sw.dash { border-top-style: dashed; }
.caption { font-size: .74rem; color: var(--fg3); margin-top: 6px; max-width: 820px; }
.axes-guide { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.axes-guide > div { background: var(--creme); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.axes-guide h4 { font-size: .95rem; margin-bottom: 6px; }
.axes-guide ul { list-style: none; }
.axes-guide li { display: grid; grid-template-columns: 38px 1fr; gap: 6px; font-size: .76rem; padding: 2px 0; border-bottom: 1px dashed var(--line); }
.axes-guide li b { text-align: right; color: var(--marine2); }

/* Lecteur (carte animée) */
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.btn { font: inherit; font-size: .8rem; font-weight: 600; background: var(--blanc); color: var(--marine); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 12px; }
.btn:hover { border-color: var(--marine2); }
.btn.primary { background: var(--marine); color: var(--creme); border-color: var(--marine); }
.btn.on { background: var(--marine2); color: #fff; border-color: var(--marine2); }
.scrub { flex: 1; min-width: 180px; position: relative; padding-bottom: 6px; }
.scrub input { width: 100%; }
.scrub .marks { position: absolute; left: 8px; right: 8px; bottom: 0; height: 5px; pointer-events: none; }
.scrub .marks i { position: absolute; width: 5px; height: 5px; border-radius: 50%; transform: translateX(-2px); }
.clock { font-variant-numeric: tabular-nums; font-size: .82rem; color: var(--fg2); min-width: 64px; }
.panel { background: var(--creme); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; position: sticky; top: 12px; }
.panel h4 { font-family: var(--sans); font-size: .66rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--marine); margin-bottom: 6px; }
.tension-head { display: flex; justify-content: space-between; align-items: baseline; }
.tension-val { font-family: var(--serif); font-size: 1.5rem; color: var(--marine); line-height: 1; }
.tension-val small { font-family: var(--sans); font-size: .7rem; color: var(--fg2); margin-left: 4px; }
.tension-svg svg { display: block; width: 100%; height: auto; }
.phase { font-size: .76rem; color: var(--fg2); font-style: italic; margin: 6px 0 10px; min-height: 2.4em; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.now { border-left: 3px solid var(--nc, var(--fg3)); background: var(--blanc); padding: 6px 8px; margin-bottom: 6px; font-size: .76rem; line-height: 1.4; border-radius: 0 var(--r) var(--r) 0; }
.now time { color: var(--fg3); font-size: .68rem; margin-right: 4px; }
.now .kind { font-weight: 700; }
.now-empty { font-size: .76rem; color: var(--fg3); font-style: italic; }

/* Temps par sujet */
.lanes svg { display: block; width: 100%; height: auto; }
.themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 4px 28px; margin-top: 10px; }
.th-head { grid-column: 1 / -1; font-size: .66rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--fg2); margin-top: 8px; }
.th-row { display: grid; grid-template-columns: 1fr 120px 92px; gap: 8px; align-items: center; font-size: .78rem; }
.th-row .lbl { display: flex; align-items: center; gap: 6px; min-width: 0; }
.th-row .lbl i { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.th-row .trk { height: 9px; background: var(--sable); border-radius: var(--r); }
.th-row .trk i { display: block; height: 100%; border-radius: var(--r); }
.th-row .min { text-align: right; color: var(--fg2); font-variant-numeric: tabular-nums; }

/* Camps */
.camps { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.camp { border: 1px solid var(--line); border-top: 4px solid var(--cc); border-radius: var(--r); padding: 12px 14px; background: var(--creme); }
.camp h4 { font-size: 1.05rem; line-height: 1.3; margin-bottom: 8px; }
.camp ul { margin-left: 16px; }
.camp li { font-size: .8rem; margin-bottom: 4px; }
.camp .note { font-size: .74rem; color: var(--fg2); font-style: italic; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--blanc); border: 1px solid var(--line); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--dc); }
.unclassified { font-size: .78rem; color: var(--fg2); margin-top: 10px; }

/* Blocs à compléter (pré-débat) */
.todo { border: 2px dashed var(--bleu-clair); background: repeating-linear-gradient(-45deg, var(--creme), var(--creme) 10px, #F5F1E8 10px, #F5F1E8 20px); border-radius: var(--r); padding: 18px 20px; color: var(--marine2); }
.todo b { display: block; font-family: var(--serif); font-size: 1.1rem; color: var(--marine); margin-bottom: 4px; }
.todo p { font-size: .8rem; color: var(--fg2); }
.todo .ph { height: 12px; background: rgba(155,187,226,.35); border-radius: var(--r); margin-top: 10px; }
.todo .ph.s { width: 70%; } .todo .ph.m { width: 85%; }
.todo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.todo.big { min-height: 260px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

/* Pré-débat rempli (export de l'appli) */
.split { display: flex; height: 9px; border-radius: var(--r); overflow: hidden; background: var(--sable); margin-top: 8px; max-width: 360px; }
.split i { display: block; height: 100%; }
.split .sp { background: var(--pour-vif); } .split .sc { background: var(--contre-vif); }
.bycamp { margin-top: 8px; display: grid; gap: 4px; max-width: 480px; }
.bycamp > div { display: grid; grid-template-columns: minmax(74px, 220px) minmax(60px, 1fr) 84px; gap: 8px; align-items: center; font-size: .72rem; color: var(--fg2); }
.bycamp .cn { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; color: var(--anthracite); }
.bycamp .cn i { width: 8px; height: 8px; border-radius: 50%; background: var(--dc); }
.bycamp .split { margin-top: 0; height: 7px; }
.bycamp .v { text-align: right; font-variant-numeric: tabular-nums; }
.camp .meta { font-size: .74rem; color: var(--fg2); margin-bottom: 8px; }
.camp .synth { font-family: var(--serif); font-size: .98rem; line-height: 1.45; margin: 0 0 10px; }
.bycamp .cn { align-items: flex-start; line-height: 1.25; }
.bycamp .cn i { margin-top: 3px; flex-shrink: 0; }
.camp li small { display: block; color: var(--fg2); font-size: .72rem; }
.camp li b.p { color: var(--pour); } .camp li b.c { color: var(--contre); }

footer { margin: 24px auto 0; padding: 16px 16px 28px; border-top: 1px solid var(--line); font-size: .74rem; color: var(--fg2); font-style: italic; }
footer p + p { margin-top: 4px; }
#tip { position: fixed; display: none; z-index: 50; max-width: 300px; background: var(--blanc); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-lg); padding: 8px 12px; font-size: .78rem; line-height: 1.45; pointer-events: none; }
#tip .sub { color: var(--fg2); font-size: .72rem; }
#tip .it { font-style: italic; color: var(--fg2); }
#load-error { margin: 20px auto; max-width: 1088px; padding: 12px 16px; border: 1px solid var(--contre); color: var(--contre); font-size: .85rem; }

@media (max-width: 900px) {
  .map-grid { grid-template-columns: 1fr; }
  .panel { position: static; }
  .stmts, .todo-grid, .axes-guide { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  details.acc > summary { padding: 14px; gap: 10px; }
  .acc-body { padding: 4px 14px 20px; }
  .acc-num { font-size: 1.4rem; }
  .th-row { grid-template-columns: 1fr 70px 80px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .acc-chev { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><img src="logo_ecclesia.webp" alt="Logo Ecclesia"><div><b>ECCLESIA</b><small>ASSOCIATION DE DÉBAT</small></div></div>
    <div class="hero">
      <div class="surtitre"><span class="accent-rect"></span><span id="hdr-label">Restitution du débat</span></div>
      <h1><span class="texte-spectre" id="hdr-title">Restitution du débat</span></h1>
      <p id="hdr-sub"></p>
      <nav class="nav" id="nav"></nav>
    </div>
  </div>
</header>
<div id="load-error" class="hidden"></div>
<main class="wrap" id="main"></main>
<footer class="wrap" id="footer"></footer>
<div id="tip"></div>

<script src="data.js"></script>
<script>
// Données : data.js (ouverture par double-clic) ou unifiee.json (site). Tout texte passe par esc().
let D = window.UNIFIED_DATA || null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 1) => (n == null ? '—' : Number(n).toFixed(d).replace('.', ','));
const fmtMin = (m) => (m < 10 ? fmt(m, 1) : String(Math.round(m))) + ' min';
const mmss = (m) => { const s = Math.round(m * 60); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
const keySort = (a, b) => a.localeCompare(b, 'fr', { numeric: true });
const TABLE_COLORS = ['var(--ta)', 'var(--tb)', 'var(--tc3)', 'var(--tc4)'];
const tableColor = (k) => TABLE_COLORS[Math.max(0, D.meta.tables.findIndex((t) => t.key === k)) % TABLE_COLORS.length];
const LINK = { accord: { c: '#3F8462', dash: null, verb: 'en accord avec' }, desaccord: { c: '#B64A3A', dash: '6 4', verb: 'en désaccord avec' }, concession: { c: '#D79E38', dash: null, verb: 'concède à' } };
const EVENT_COLORS = { dissensus: '#B64A3A', consensus: '#3F8462', concession: '#D79E38', technique: '#898A8C', meta: '#7A5C99', cadrage: '#6383B4' };
const EVENT_NAMES = { dissensus: 'dissensus', consensus: 'consensus', concession: 'concession', technique: 'point technique', meta: 'méta', cadrage: 'cadrage' };
const LINK_WINDOW = 3, LEAN = 0.2;

// Infobulles : chaque élément survolable porte data-tip = indice dans TIPS (HTML déjà échappé).
const TIPS = [];
const tipAttr = (html) => `data-tip="${TIPS.push(html) - 1}"`;
const tipEl = $('tip');
document.addEventListener('mousemove', (e) => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tipEl.style.display = 'none'; return; }
  tipEl.innerHTML = TIPS[+el.dataset.tip]; tipEl.style.display = 'block';
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - w - 8)) + 'px';
  tipEl.style.top = Math.max(8, Math.min(e.clientY + 14, innerHeight - h - 8)) + 'px';
});

function boot() {
  if (D) return render();
  fetch('unifiee.json').then((r) => r.json()).then((d) => { D = d; render(); }).catch(() => {
    const e = $('load-error'); e.textContent = 'Aucune donnée : ouvrir la page à côté de data.js ou de unifiee.json.'; e.classList.remove('hidden');
  });
}

// ───────────────────────── Page ─────────────────────────
function render() {
  const T = D.tables, date = D.meta.date ? D.meta.date.split('-').reverse().join('/') : '';
  document.title = `Ecclesia — ${D.meta.topic}`;
  $('hdr-label').textContent = ['Restitution du débat', date, `${T.length} table${T.length > 1 ? 's' : ''}`].filter(Boolean).join(' · ');
  $('hdr-title').textContent = D.meta.topic;
  $('hdr-sub').textContent = `${D.flash.n_participants} participants. Chaque menu se déplie et se replie : la synthèse du questionnaire d'avant le débat, la synthèse flash de toutes les tables, puis une page par table — retrouvez la vôtre grâce à son code.`;

  const sections = [
    { id: 'pre', num: '01', title: 'Synthèse pré-débat', nav: 'Pré-débat', sub: 'Ce que disait le questionnaire envoyé avant le débat', acc: 'var(--bleu-clair)', body: preDebateHTML() },
    { id: 'flash', num: '02', title: 'Synthèse flash', nav: 'Synthèse flash', sub: T.length > 1 ? `Toutes les tables réunies, en quelques minutes de lecture` : 'La table en quelques minutes de lecture', acc: 'var(--marine)', body: flashHTML(), open: true },
    ...T.map((t, i) => ({ id: `table-${t.key}`, num: String(i + 3).padStart(2, '0'), title: `${t.label} · ${t.code}`, sub: `${t.personas.length} participants · ${fmtMin(t.duration)} de débat`, acc: tableColor(t.key), body: tableHTML(t) })),
  ];
  $('main').innerHTML = sections.map((s) => `
    <details class="acc" id="${s.id}" style="--acc:${s.acc}"${s.open ? ' open' : ''}>
      <summary><span class="acc-num">${s.num}</span><span class="acc-title"><h2>${esc(s.title)}</h2><p>${esc(s.sub)}</p></span><span class="acc-chev" aria-hidden="true"></span></summary>
      <div class="acc-body">${s.body}</div>
    </details>`).join('');
  $('nav').innerHTML = sections.map((s) => `<a href="#${s.id}" data-open="${s.id}">${s.id.startsWith('table-') ? `<i style="background:${s.acc}"></i>` : ''}${esc(s.nav || s.title)}</a>`).join('') +
    '<span class="sep"></span><button type="button" id="open-all">Tout déplier</button><button type="button" id="close-all">Tout replier</button>';
  document.querySelectorAll('[data-open]').forEach((a) => a.addEventListener('click', () => { $(a.dataset.open).open = true; }));
  $('open-all').addEventListener('click', () => document.querySelectorAll('details.acc').forEach((d) => (d.open = true)));
  $('close-all').addEventListener('click', () => document.querySelectorAll('details.acc').forEach((d) => (d.open = false)));
  // #table-A, #flash… : ouvre le menu visé, au chargement comme sur un lien interne
  const openFromHash = () => { const el = location.hash && $(decodeURIComponent(location.hash.slice(1))); if (el && el.tagName === 'DETAILS') el.open = true; };
  window.addEventListener('hashchange', openFromHash); openFromHash();

  T.forEach((t) => new Player(t));
  $('footer').innerHTML = (D.footer || []).map((f) => `<p>${esc(f)}</p>`).join('');
}

// Données exportées par l'appli (chantier 170) : rendu avec les composants de la synthèse flash.
// Sans export (pre_debate null) : blocs à compléter.
function preDebateHTML() {
  const intro = `<p class="help" style="margin-top:18px">Avant le débat, chaque participant a voté pour ou contre une série d'affirmations sur le sujet. Ces votes dessinent des camps d'opinion établis <b>avant</b> toute discussion, à comparer avec ceux qui ressortent de la transcription (menu suivant).</p>`;
  if (D.pre_debate) return intro + preDebateFilledHTML(D.pre_debate);
  const todo = (title, text, lines = 3, cls = '') => `<div class="todo ${cls}"><b>${esc(title)}</b><p>${esc(text)}</p>${cls === 'big' ? '' : Array.from({ length: lines }, (_, i) => `<div class="ph ${['m', 's', ''][i % 3]}"></div>`).join('')}</div>`;

    <div class="block"><div class="label">Les assertions du questionnaire</div>
      <div class="todo-grid">
        ${todo('Ici : les 3 assertions les plus consensuelles', 'Énoncé, part de pour et de contre, nombre de votants — même présentation que les consensus de la synthèse flash.')}
        ${todo('Ici : les 3 assertions les plus dissensuelles', 'Énoncé, répartition pour/contre, nombre de votants — les affirmations qui coupaient la salle en deux avant le débat.')}
      </div>
    </div>
    <div class="block"><div class="label">Les camps d'opinion avant le débat</div>

const pct = (v) => (v == null ? 'n.d.' : `${Math.round(v * 100)} %`);
const preCampName = (c) => c.nom_ia || `Camp ${c.camp}`;
function splitBar(p, c) {
  const n = p + c || 1;
  return `<div class="split" ${tipAttr(`${p} pour · ${c} contre`)}><i class="sp" style="width:${(100 * p) / n}%"></i><i class="sc" style="width:${(100 * c) / n}%"></i></div>`;
}

// Ligne d'énoncé commune à tous les menus. Anonyme : décomptes seulement, jamais qui a pris position.
// r = { text, kind: 'cons'|'diss', sens: 'adhesion'|'rejet', pour, contre, extras: [texte], camps: [{ name, color, pour, contre, value }] }
function stmtRowHTML(r, i) {
  const badge = r.kind === 'cons'
    ? `<span class="badge ${r.sens === 'rejet' ? 'contre' : 'pour'}">${r.sens === 'rejet' ? 'Rejet' : 'Adhésion'}</span>`
    : '<span class="badge diss">Dissensus</span>';
  const share = r.pour + r.contre ? ` · ${pct(r.pour / (r.pour + r.contre))} pour` : '';
  const extras = r.extras.filter(Boolean).map((e) => ` · ${esc(e)}`).join('');
  const byCamp = r.camps.map((c) => `<div><span class="cn" style="--dc:${c.color}"><i></i><span>${esc(c.name)}</span></span>${splitBar(c.pour, c.contre)}<span class="v">${esc(c.value)}</span></div>`).join('');
  return `<div class="st"><span class="st-rank">${i + 1}</span><div>
    <div class="st-text">${esc(r.text)}</div>${badge}<span class="st-count"><b class="p">${r.pour} pour</b> · <b class="c">${r.contre} contre</b>${extras}${share}</span>
    ${splitBar(r.pour, r.contre)}
    ${byCamp ? `<div class="bycamp">${byCamp}</div>` : ''}
  </div></div>`;
}
function stmtColumnHTML(title, color, rows, ties, noun) {
  const n = rows.length;
  const short = n < 3 ? `<p class="short">${n === 0 ? `Aucun${noun.f ? 'e' : ''} ${noun.one} ne remplit ce critère.` : n === 1 ? `Un${noun.f ? 'e' : ''} seul${noun.f ? 'e' : ''} ${noun.one} remplit ce critère.` : `Seul${noun.f ? 'e' : ''}s ${n} ${noun.many} remplissent ce critère.`}</p>` : '';
  const tie = ties && ties.length ? `<p class="ties">À égalité avec le n° ${n} : ${ties.map(esc).join(' ; ')}.</p>` : '';
  return `<div class="stcol" style="--col:${color}"><h3>${title}</h3>${rows.map(stmtRowHTML).join('')}${short}${tie}</div>`;
}

function preDebateFilledHTML(P) {
  const campOf = Object.fromEntries(P.camps.map((c) => [c.camp, c]));
  const n = P.participation;
  const toRow = (s, kind) => ({
    text: s.enonce, kind, sens: s.sens, pour: s.pour, contre: s.contre,
    extras: [s.abstention ? `${s.abstention} abstention${s.abstention > 1 ? 's' : ''}` : '', s.blanc ? `${s.blanc} blanc${s.blanc > 1 ? 's' : ''}` : ''],
    camps: s.par_camp.map((pc) => ({ name: preCampName(campOf[pc.camp]), color: campOf[pc.camp].couleur, pour: pc.pour, contre: pc.contre,
      value: pc.part_pour == null ? 'n.d.' : `${pct(pc.part_pour)} pour` })),
  });
  const noun = { one: 'assertion', many: 'assertions', f: true };
  const col = (title, color, rows, kind) => stmtColumnHTML(title, color, rows.map((s) => toRow(s, kind)), [], noun);
  const camps = P.camps.map((c) => `<div class="camp" style="--cc:${c.couleur}"><h4>${esc(preCampName(c))}</h4>
    <p class="meta">${c.nom_ia ? `Camp ${c.camp} · ` : ''}${c.taille} votant${c.taille > 1 ? 's' : ''} · ${pct(c.part)} des votants placés</p>
    ${c.synthese ? `<p class="synth">${esc(c.synthese)}</p>` : ''}
    ${c.description_ia ? `<p class="note" style="margin:0 0 8px">${esc(c.description_ia)}</p>` : ''}
    ${c.enonces_caracteristiques.length ? `<ul>${c.enonces_caracteristiques.map((e) => `<li><b class="${e.sens === 'pour' ? 'p' : 'c'}">${e.sens === 'pour' ? 'Pour' : 'Contre'} :</b> ${esc(e.enonce)}<small>${pct(e.part_pour_camp)} pour dans ce camp, ${pct(e.part_pour_reste)} chez les autres votants</small></li>`).join('')}</ul>` : '<p class="note">Aucune assertion ne distingue nettement ce camp.</p>'}
  </div>`).join('');
  const v = P.carte.variance_expliquee;
  return `
    <div class="block"><div class="label">En bref</div>
      <div class="stats">
        <span class="stat"><b>${n.votants_places}</b>votants placés</span>
        <span class="stat"><b>${n.votes}</b>votes</span>
        <span class="stat"><b>${n.assertions_analysees}</b>assertions classées sur ${n.assertions_approuvees}</span>
        <span class="stat"><b>${P.camps.length}</b>camp${P.camps.length > 1 ? 's' : ''} d'opinion</span>
      </div>
    </div>
    <div class="block"><div class="label">Consensus et dissensus avant le débat</div>
      <p class="help">La barre verte et rouge donne la part de pour et de contre ; en dessous, la même part dans chaque camp d'opinion.</p>
      <div class="stmts">${col('Les plus forts consensus', 'var(--pour)', P.consensus, 'cons')}${col('Les plus forts dissensus', 'var(--contre)', P.dissensus, 'diss')}</div>
      <details class="howto"><summary>Comment ce classement est calculé</summary><p>Par l'appli, à partir des votes d'avant le débat. Un <b>consensus</b> est une assertion que chaque camp soutient (adhésion) ou rejette (rejet) : elle est classée selon la part du camp le moins convaincu. Un <b>dissensus</b> est une assertion qui oppose les camps : elle est classée selon l'écart de part de pour entre le camp le plus pour et le camp le plus contre. Seules les assertions avec au moins 3 votes pour ou contre sont classées ; abstentions et votes blancs n'entrent pas dans les parts. Un camp avec moins de 2 votes pour ou contre sur une assertion n'a pas de part (n.d.).</p></details>
    </div>
    <div class="block"><div class="label">Les camps d'opinion avant le débat</div>
      <p class="help">Chaque point est un votant, anonyme, placé selon ses votes et coloré selon son camp ; le grand cercle numéroté marque le centre du camp. Deux votants proches ont voté de façon semblable.</p>
      <div class="map-box" id="pre-map">${preMapSVG(P)}</div>
      <div class="legend">${P.camps.map((c) => `<span><i style="background:${c.couleur}"></i>${esc(preCampName(c))} (${c.taille})</span>`).join('')}</div>
      <p class="caption">${P.axes
        ? 'Les axes sont les deux premières composantes principales des votes ; leurs libellés sont une lecture, déduite de la position des camps et des assertions qui les distinguent, pas une mesure.'
        : 'Les axes sont les deux premières composantes principales des votes : ils n\'ont pas de libellé, seuls les distances et les regroupements ont un sens.'} Ce plan n'est pas celui de la carte du débat (menu suivant).${v ? ` Ces deux axes résument ${Math.round((v[0] + v[1]) * 100)} % des écarts entre votants.` : ''}</p>
    </div>
    <div class="block"><div class="label">Qui pense quoi : les camps expliqués</div>
      <p class="help">Pour chaque camp, les assertions qui le distinguent le plus du reste des votants.</p>
      <div class="camps">${camps}</div>
    </div>`;
}

function preMapSVG(P) {
  const g = [`<rect x="${mx(-10)}" y="${my(10)}" width="${mx(10) - mx(-10)}" height="${my(-10) - my(10)}" fill="var(--creme)" stroke="var(--line)"/>`];
  for (let v = -7.5; v <= 7.5; v += 2.5) {
    const st = v === 0 ? 'stroke="#C6C4BF" stroke-width="1.5"' : 'stroke="var(--line)" stroke-dasharray="2 4"';
    g.push(`<line x1="${mx(v)}" y1="${my(10)}" x2="${mx(v)}" y2="${my(-10)}" ${st}/><line x1="${mx(-10)}" y1="${my(v)}" x2="${mx(10)}" y2="${my(v)}" ${st}/>`);
  }
  if (P.axes) {
    const a = P.axes;
    g.push(`<g font-size="12" font-weight="700" fill="var(--marine)"><text x="${mx(-10)}" y="${my(-10) + 22}">◀ ${esc(a.x.left)}</text><text x="${mx(10)}" y="${my(-10) + 22}" text-anchor="end">${esc(a.x.right)} ▶</text><text x="${mx(0)}" y="${my(10) - 12}" text-anchor="middle">▲ ${esc(a.y.top)}</text><text x="${mx(0)}" y="${my(-10) + 42}" text-anchor="middle">▼ ${esc(a.y.bottom)}</text></g>`);
  }
  const campOf = Object.fromEntries(P.camps.map((c) => [c.camp, c]));
  P.carte.points.forEach((p) => {
    const c = campOf[p.camp];
    g.push(`<circle cx="${mx(p.x)}" cy="${my(p.y)}" r="7" fill="${c.couleur}" fill-opacity="0.75" stroke="var(--blanc)" stroke-width="1.5" ${tipAttr(`Un votant · <b>${esc(preCampName(c))}</b>`)}/>`);
  });
  P.camps.forEach((c) => {
    const x = mx(c.centre.x), y = my(c.centre.y);
    g.push(`<g ${tipAttr(`<b>${esc(preCampName(c))}</b><div class="sub">${c.taille} votant${c.taille > 1 ? 's' : ''} · centre du camp</div>`)}><circle cx="${x}" cy="${y}" r="15" fill="var(--blanc)" fill-opacity="0.85" stroke="${c.couleur}" stroke-width="3"/><text x="${x}" y="${y + 4}" font-size="12" font-weight="700" text-anchor="middle" fill="${c.couleur}" pointer-events="none">${c.camp}</text></g>`);
  });
  return `<svg viewBox="0 0 ${MAP.W} ${MAP.H}" role="img" aria-label="Carte des camps d'opinion avant le débat">${g.join('')}</svg>`;
}

// ───────────────────────── Composants partagés ─────────────────────────

// Énoncés relevés dans la transcription. camps : camps d'opinion du menu (ordre = n° de camp, 1-indexé).
// scope : { one: 'énoncé commun aux tables', many: 'énoncés communs aux tables' }.
function statementsHTML(ranking, camps, scope) {
  const campInfo = (n) => (n === 0 ? { name: 'Non rattachés', color: '#898A8C' } : { name: camps[n - 1].label, color: camps[n - 1].color });
  const toRow = (s, kind) => ({
    text: s.text, kind, sens: s.side === 'contre' ? 'rejet' : 'adhesion', pour: s.p, contre: s.c,
    extras: [s.nu ? `${s.nu} nuancé${s.nu > 1 ? 's' : ''}` : ''],
    camps: (s.par_camp || []).filter((pc) => pc.pour + pc.contre + pc.nuance > 0).map((pc) => ({
      ...campInfo(pc.camp), pour: pc.pour, contre: pc.contre,
      value: pc.pour + pc.contre ? `${pct(pc.pour / (pc.pour + pc.contre))} pour` : `${pc.nuance} nuancé${pc.nuance > 1 ? 's' : ''}` })),
  });
  const noun = { one: scope.one, many: scope.many, f: false };
  return `<div class="stmts">${stmtColumnHTML('Les plus forts consensus', 'var(--pour)', ranking.consensus.map((s) => toRow(s, 'cons')), ranking.consensus_ties, noun)}${stmtColumnHTML('Les plus forts dissensus', 'var(--contre)', ranking.dissensus.map((s) => toRow(s, 'diss')), ranking.dissensus_ties, noun)}</div>
    <details class="howto"><summary>Comment ce classement est calculé</summary><p>À partir des prises de position relevées dans la transcription (pour, contre, nuancé). Un <b>consensus</b> réunit au moins 3 voix pour ou contre, dont au moins les trois quarts du même côté ; adhésion comme rejet comptent, et ils sont classés par écart net entre les deux côtés. Un <b>dissensus</b> a des voix des deux côtés sans majorité nette ; il est classé par la taille du côté minoritaire. Les voix nuancées sont comptées à part et n'entrent pas dans les parts. Les camps sans prise de position sur un énoncé n'apparaissent pas sous sa barre : ne pas s'être exprimé ne veut pas dire être neutre.</p></details>`;
}

function campsHTML(groups, unclassified) {
  const who = (n) => `${n} participant${n > 1 ? 's' : ''}`;
  const byTable = (g) => (g.by_table && D.tables.length > 1
    ? ` (${D.tables.filter((t) => g.by_table[t.key]).map((t) => `${g.by_table[t.key]} à la table ${esc(t.key)}`).join(', ')})` : '');
  const cards = groups.map((g) => `<div class="camp" style="--cc:${g.color}"><h4>${esc(g.label)}</h4>
    <p class="meta">${who(g.size)}${byTable(g)}</p>
    <ul>${(g.arguments || []).map((a) => `<li>${esc(a)}</li>`).join('')}</ul>${g.note ? `<p class="note">${esc(g.note)}</p>` : ''}</div>`).join('');
  const un = unclassified && unclassified.count
    ? `<p class="unclassified"><b>${who(unclassified.count)} non rattaché${unclassified.count > 1 ? 's' : ''} :</b> ${esc(unclassified.note)}</p>` : '';
  return `<div class="camps">${cards}</div>${un}`;
}

// Plan 2D commun à tous les menus : grille de l'analyse croisée, -10..+10 sur chaque axe.
const MAP = { W: 720, H: 610, L: 58, R: 22, T: 34, B: 58 };
const mx = (x) => MAP.L + ((x + 10) / 20) * (MAP.W - MAP.L - MAP.R);
const my = (y) => MAP.T + ((10 - y) / 20) * (MAP.H - MAP.T - MAP.B);
function radiusFn(people) { const m = Math.max(...people.map((p) => p.weight)); return (p) => 8 + 14 * Math.sqrt(p.weight / m); }
// Points superposés (même case de la grille) : écartés en cercle autour de leur position commune.
function spreadOffsets(people) {
  const groups = {}, off = {};
  people.forEach((p) => { const k = `${p.x}|${p.y}`; (groups[k] = groups[k] || []).push(p.key); });
  Object.values(groups).forEach((arr) => {
    arr.sort(keySort);
    arr.forEach((k, i) => {
      if (arr.length === 1) { off[k] = [0, 0]; return; }
      const a = (2 * Math.PI * i) / arr.length - Math.PI / 2, r = 14 + 3 * arr.length;
      off[k] = [r * Math.cos(a), r * Math.sin(a)];
    });
  });
  return off;
}
function mapBackground() {
  const ax = D.axes, g = [];
  g.push(`<rect x="${mx(-10)}" y="${my(10)}" width="${mx(10) - mx(-10)}" height="${my(-10) - my(10)}" fill="var(--creme)" stroke="var(--line)"/>`);
  [[-10, 0, 0, 10], [0, 0, 10, 10], [-10, -10, 0, 0], [0, -10, 10, 0]].forEach(([x1, y1, x2, y2], i) => {
    if (i === 1 || i === 2) g.push(`<rect x="${mx(x1)}" y="${my(y2)}" width="${mx(x2) - mx(x1)}" height="${my(y1) - my(y2)}" fill="var(--sable)" opacity="0.55"/>`);
  });
  for (let v = -7.5; v <= 7.5; v += 2.5) {
    const z = v === 0, st = z ? 'stroke="#C6C4BF" stroke-width="1.5"' : 'stroke="var(--line)" stroke-dasharray="2 4"';
    g.push(`<line x1="${mx(v)}" y1="${my(10)}" x2="${mx(v)}" y2="${my(-10)}" ${st}/><line x1="${mx(-10)}" y1="${my(v)}" x2="${mx(10)}" y2="${my(v)}" ${st}/>`);
    const l = (v > 0 ? '+' : '') + String(v).replace('.', ',');
    g.push(`<text x="${mx(v)}" y="${my(-10) + 14}" font-size="10" text-anchor="middle" fill="var(--fg3)">${l}</text><text x="${mx(-10) - 7}" y="${my(v) + 3}" font-size="10" text-anchor="end" fill="var(--fg3)">${l}</text>`);
  }
  const q = ax.quadrants;
  g.push(`<g font-size="11" fill="var(--fg3)" font-style="italic"><text x="${mx(-10) + 8}" y="${my(10) + 16}">${esc(q.topLeft)}</text><text x="${mx(10) - 8}" y="${my(10) + 16}" text-anchor="end">${esc(q.topRight)}</text><text x="${mx(-10) + 8}" y="${my(-10) - 8}">${esc(q.bottomLeft)}</text><text x="${mx(10) - 8}" y="${my(-10) - 8}" text-anchor="end">${esc(q.bottomRight)}</text></g>`);
  g.push(`<g font-size="12" font-weight="700" fill="var(--marine)"><text x="${mx(-10)}" y="${my(-10) + 34}">◀ ${esc(ax.x.leftLabel)}</text><text x="${mx(10)}" y="${my(-10) + 34}" text-anchor="end">${esc(ax.x.rightLabel)} ▶</text><text x="${mx(0)}" y="${my(10) - 12}" text-anchor="middle">▲ ${esc(ax.y.topLabel)}</text><text x="${mx(0)}" y="${my(-10) + 52}" text-anchor="middle">▼ ${esc(ax.y.bottomLabel)}</text></g>`);
  return g.join('');
}
function uncertainLines(p, color) {
  const u = p.uncertain || {}, out = [];
  if (u.x) out.push(`<line x1="${mx(-10)}" y1="${my(p.y)}" x2="${mx(10)}" y2="${my(p.y)}" stroke="${color}" stroke-dasharray="1 4" opacity="0.6"/>`);
  if (u.y) out.push(`<line x1="${mx(p.x)}" y1="${my(10)}" x2="${mx(p.x)}" y2="${my(-10)}" stroke="${color}" stroke-dasharray="1 4" opacity="0.6"/>`);
  return out.join('');
}
function personTip(p, extra) {
  const u = p.uncertain || {};
  return `<b>${esc(p.key)}</b> — ${esc(p.camp)}<div class="sub">${extra}</div><div class="it">${esc(p.note)}</div>` +
    Object.keys(u).map((a) => `<div class="sub">Position non déterminable sur l'axe ${a === 'x' ? 'horizontal' : 'vertical'} : ${esc(u[a])}</div>`).join('');
}
function axesGuideHTML() {
  const blk = (a, lo, hi) => `<div><h4>${esc(a[lo + 'Label'])} ↔ ${esc(a[hi + 'Label'])}</h4><ul>${(a.levels || []).map((l) => `<li><b>${l.v > 0 ? '+' : ''}${String(l.v).replace('.', ',')}</b><span>${esc(l.text)}</span></li>`).join('')}</ul></div>`;
  return `<details class="howto"><summary>Comment lire les deux axes</summary><div class="axes-guide">${blk(D.axes.x, 'left', 'right')}${blk(D.axes.y, 'bottom', 'top')}</div></details>`;
}

// ───────────────────────── 02 · Synthèse flash ─────────────────────────
function flashHTML() {
  const F = D.flash, T = D.tables;
  return `
    <div class="block"><div class="label">En bref</div>
      <p class="resume">${esc(F.summary)}</p>

const KIND_ORDER = ['coeur', 'connexe', 'annexe'];
function lanesSVG(t) {
  const W = 1040, L = 150, R = 12, top = 6, laneH = 60, H = top + 3 * laneH + 26, dur = t.duration;
  const x = (m) => L + (m / dur) * (W - L - R);

  const laneY = (k) => top + KIND_ORDER.indexOf(k) * laneH;
  const g = [];
  KIND_ORDER.forEach((k, i) => {
    g.push(`<rect x="${L}" y="${laneY(k)}" width="${W - L - R}" height="${laneH - 4}" fill="${i % 2 ? 'var(--creme)' : 'var(--sable)'}" opacity="0.7"/>`);
    g.push(`<text x="${L - 12}" y="${laneY(k) + laneH / 2 + 2}" text-anchor="end" font-size="12" font-weight="700" fill="var(--marine)" ${tipAttr(`<b>${esc(t.kinds[k].label)}</b><div class="sub">${esc(t.kinds[k].desc)}</div>`)}>${esc(t.kinds[k].label)}</text>`);
  });
  for (let m = 0; m <= dur; m += 10) g.push(`<text x="${x(m)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--fg3)">${m}'</text>`);

  // fil du débat : relie les blocs dans l'ordre chronologique
  const pts = [];
  segs.forEach(([a, b, id], i) => { const y = laneY(theme[id].kind) + laneH / 2 - 2; if (i) pts.push([x(a), pts[pts.length - 1][1]]); pts.push([x(a), y], [x(b), y]); });
  if (pts.length) g.push(`<polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="var(--fg3)" stroke-width="1.2" opacity="0.7"/>`);
  segs.forEach(([a, b, id]) => {
    const th = theme[id], w = x(b) - x(a), y = laneY(th.kind) + 7;
    g.push(`<rect x="${x(a) + 0.5}" y="${y}" width="${Math.max(1.5, w - 1)}" height="${laneH - 18}" rx="2" fill="${th.color}" ${tipAttr(`<b>${esc(th.label)}</b><div class="sub">${esc(t.kinds[th.kind].label)} · ${mmss(a)} → ${mmss(b)} (${fmtMin(b - a)})</div>${th.desc ? `<div class="it">${esc(th.desc)}</div>` : ''}`)}/>`);
    const fits = (s) => s && s.length * 6.3 <= w - 10, lbl = fits(th.label) ? th.label : fits(th.short) ? th.short : null;
    if (lbl) g.push(`<text x="${x(a) + 6}" y="${y + (laneH - 18) / 2 + 4}" font-size="11" font-weight="600" fill="#fff" pointer-events="none">${esc(lbl)}</text>`);
  });

}

  const rows = KIND_ORDER.map((k) => {
    const list = t.themes.filter((th) => th.kind === k && tm[th.id]).sort((a, b) => tm[b.id] - tm[a.id]);
    if (!list.length) return '';
    return `<div class="th-head">${esc(t.kinds[k].label)}</div>` + list.map((th) => `<div class="th-row" ${tipAttr(`<b>${esc(th.label)}</b>${th.desc ? `<div class="it">${esc(th.desc)}</div>` : ''}`)}><span class="lbl"><i style="background:${th.color}"></i>${esc(th.label)}</span><span class="trk"><i style="width:${(100 * tm[th.id]) / max}%;background:${th.color}"></i></span><span class="min">${fmtMin(tm[th.id])} · ${pct(tm[th.id])}</span></div>`).join('');

// Lecteur d'une table : carte animée + tension + « ce qui vient d'être dit », sur une même horloge.
class Player {
  constructor(t) {
    this.t = t; this.root = $(`table-${t.key}`); this.now = t.duration; this.playing = false; this.speed = 1; this.last = 0;
    const q = (r) => this.root.querySelector(`[data-role="${r}"]`);
    Object.assign(this, { elMap: q('map'), elSlider: q('slider'), elClock: q('clock'), elPlay: q('play'), elAll: q('all-links'),
      elTension: q('tension'), elTval: q('tval'), elTword: q('tword'), elPhase: q('phase'), elNow: q('now') });
    this.byKey = Object.fromEntries(t.personas.map((p) => [p.key, p]));
    this.r = radiusFn(t.personas); this.off = spreadOffsets(t.personas);

    this.elAll.addEventListener('change', () => this.update());

      this.speed = +b.dataset.speed; this.root.querySelectorAll('[data-speed]').forEach((x) => x.classList.toggle('on', x === b));

  }

  pause() { this.playing = false; this.elPlay.textContent = '▶ Lecture'; }
  seek(m) { this.now = Math.max(0, Math.min(this.t.duration, m)); this.update(); }
  tick(ts) {
    if (!this.playing) return;
    if (this.last) this.now = Math.min(this.t.duration, this.now + ((ts - this.last) / 1000) * (this.t.duration / 60) * this.speed); // débat entier en 60 s à ×1
    this.last = ts; this.update();

  basePos(p, t) {

    const id = `m${T.key}`, g = [mapBackground()];
    g.push(`<defs>${Object.entries(LINK).map(([k, l]) => `<marker id="${id}-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${l.c}"/></marker>`).join('')}<marker id="${id}-shift" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--marine)"/></marker></defs>`);

    svg.addEventListener('click', (e) => {
      const ev = e.target.closest('[data-seek]'); this.pause();
      if (ev) return this.seek(+ev.dataset.seek);
      const r = svg.getBoundingClientRect(), vx = ((e.clientX - r.left) / r.width) * W;
      this.seek(((vx - L) / (W - L - R)) * dur);
    });
  }
  updateTension(t) {
    if (!this.readhead) return;
    const v = this.tensionAt(t), x = this.tx(t);
    this.readhead.setAttribute('x1', x); this.readhead.setAttribute('x2', x);
    const inRefus = (this.t.refus || []).some(([a, b]) => t >= a && t <= b);
    this.elTval.innerHTML = inRefus ? '—<small>non enregistré</small>' : `${Math.round(v)}<small>/ 100</small>`;
    this.elTword.textContent = inRefus ? '' : v >= 72 ? 'échanges vifs' : v <= 45 ? 'échanges calmes' : 'échanges animés';
    let cur = null; (this.t.events || []).forEach((ev) => { if (ev.t <= t) cur = ev; });
    this.elPhase.textContent = cur ? `${mmss(cur.t)} · ${cur.title} — ${cur.desc}` : 'Le débat commence.';
  }
  updateNow(t) {
    const T = this.t, items = [];
    T.personas.forEach((p) => (p.points || []).forEach((pt) => { if (pt.t <= t) items.push({ t: pt.t, c: p.color, html: `<span class="kind">${esc(p.key)}</span> ${esc(pt.stance)}` }); }));
    T.personas.forEach((p) => (p.shifts || []).forEach((s) => { if (s.t <= t) items.push({ t: s.t + 0.002, c: 'var(--marine)', html: `<span class="kind">${esc(p.key)} change d'avis</span> ${esc(s.desc)}` }); }));
    T.interactions.forEach((it) => { if (it.t <= t) items.push({ t: it.t + 0.001, c: LINK[it.type].c, html: `<span class="kind" style="color:${LINK[it.type].c}">${esc(it.from)} ${LINK[it.type].verb} ${esc(it.to)}</span> ${esc(it.desc)}` }); });
    items.sort((a, b) => b.t - a.t);
    const top = items.slice(0, 4);
    this.elNow.innerHTML = top.length ? top.map((it) => `<div class="now" style="--nc:${it.c}"><time>${mmss(it.t)}</time>${it.html}</div>`).join('') : '<p class="now-empty">Rien encore à ce moment du débat.</p>';
  }
}

boot();
</script>
